<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3158c5">
    <meta name="description" content="Calculez votre moyenne et suivez vos reprises.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
    <title>MaMoyenne</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="./icons/icon-192.png" alt="" width="44" height="44">
          <div>
            <h1>MaMoyenne</h1>
            <p id="profile-summary"></p>
          </div>
        </div>
        <div class="top-actions">
          <details id="action-menu" class="action-menu">
            <summary id="action-menu-trigger" class="menu-trigger" aria-label="Menu" aria-controls="action-menu-panel">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M4 7h16M4 12h16M4 17h16"></path>
              </svg>
            </summary>
            <nav id="action-menu-panel" class="action-menu-panel" aria-label="Menu principal">
              <button id="install-button" class="menu-item" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3v12m0 0 4-4m-4 4-4-4"></path>
                  <path d="M5 17v3h14v-3"></path>
                </svg>
                <span data-i18n="install"></span>
              </button>
              <button id="profile-button" class="menu-item" type="button" aria-label="Profil" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4"></circle>
                  <path d="M5 21a7 7 0 0 1 14 0"></path>
                </svg>
                <span data-i18n="profile-button"></span>
              </button>
              <button id="settings-button" class="menu-item" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 7h9m4 0h3M4 17h3m4 0h9"></path>
                  <circle cx="15" cy="7" r="2"></circle>
                  <circle cx="9" cy="17" r="2"></circle>
                </svg>
                <span data-i18n="settings"></span>
              </button>
              <div id="data-menu-divider" class="menu-divider" data-profile-action hidden></div>
              <p class="menu-heading" data-i18n="data-menu-title" data-profile-action hidden></p>
              <button id="csv-import-button" class="menu-item" type="button" data-profile-action hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 16V4m0 0L8 8m4-4 4 4"></path>
                  <path d="M5 17v3h14v-3"></path>
                </svg>
                <span data-i18n="import-csv"></span>
              </button>
              <input id="csv-input" type="file" accept=".csv,text/csv" hidden>
              <button id="export-csv" class="menu-item" type="button" data-profile-action hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 4v12m0 0 4-4m-4 4-4-4"></path>
                  <path d="M5 17v3h14v-3"></path>
                </svg>
                <span data-i18n="export-csv"></span>
              </button>
              <button id="export-pdf" class="menu-item" type="button" data-profile-action hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                  <path d="M6 14h12v7H6z"></path>
                </svg>
                <span data-i18n="export-pdf"></span>
              </button>
            </nav>
          </details>
        </div>
      </header>

      <main>
        <section id="setup-view" class="setup-card" hidden>
          <p class="eyebrow" data-i18n="welcome"></p>
          <h2 data-i18n="setup-title"></h2>
          <p class="muted" data-i18n="setup-description"></p>
          <form id="setup-form" class="form-stack">
            <label>
              <span data-i18n="your-name"></span>
              <input id="profile-name" name="name" autocomplete="name" maxlength="60" required>
            </label>
            <label>
              <span data-i18n="your-level"></span>
              <select id="profile-level" name="level" required>
                <option value="L1">L1 · 70</option>
                <option value="L2">L2 · 70</option>
                <option value="L3">L3 · 75</option>
                <option value="L4">L4 · 80</option>
              </select>
            </label>
            <button class="primary-button" type="submit" data-i18n="start"></button>
          </form>
        </section>

        <section id="dashboard-view" hidden>
          <div class="period-row">
            <label class="period-control">
              <span data-i18n="period"></span>
              <select id="period-select" aria-label="Période active"></select>
            </label>
            <button id="manage-periods" class="secondary-button" type="button" data-i18n="manage-periods"></button>
          </div>

          <section class="summary-grid" aria-label="Résumé">
            <article class="summary-card">
              <span data-i18n="average"></span>
              <strong id="average-value">—</strong>
              <small data-i18n="out-of-100"></small>
            </article>
            <article class="summary-card">
              <span data-i18n="retakes"></span>
              <strong id="retake-value">0</strong>
              <small id="retake-detail"></small>
            </article>
            <article class="summary-card">
              <span data-i18n="graded-subjects"></span>
              <strong id="graded-value">0</strong>
              <small id="subject-count-detail"></small>
            </article>
          </section>

          <section class="subject-tools" aria-label="Commandes de la liste">
            <label class="field-control">
              <span data-i18n="sort"></span>
              <select id="sort-select">
                <option value="added" data-i18n="sort-added"></option>
                <option value="graded" data-i18n="sort-graded"></option>
                <option value="best" data-i18n="sort-best"></option>
                <option value="worst" data-i18n="sort-worst"></option>
                <option value="custom" data-i18n="sort-custom"></option>
              </select>
            </label>
            <label class="field-control search-control">
              <span data-i18n="search"></span>
              <input id="search-input" type="search" autocomplete="off">
            </label>
            <button id="add-subject" class="primary-button add-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
              <span data-i18n="add-subject"></span>
            </button>
          </section>

          <p id="custom-order-hint" class="muted order-hint" hidden></p>
          <div id="subject-list" class="subject-list"></div>
          <div id="empty-message" class="empty-card" hidden>
            <strong data-i18n="empty-title"></strong>
            <span id="empty-description"></span>
          </div>

          <p class="privacy-note" data-i18n="local-data-note"></p>
        </section>

        <section id="print-report" class="print-report" hidden>
          <header class="print-header">
            <h1 id="print-title"></h1>
            <p id="print-subtitle"></p>
          </header>
          <dl class="print-summary">
            <div>
              <dt data-i18n="print-average"></dt>
              <dd id="print-average"></dd>
            </div>
            <div>
              <dt data-i18n="print-retakes"></dt>
              <dd id="print-retakes"></dd>
            </div>
            <div>
              <dt data-i18n="print-subject-count"></dt>
              <dd id="print-subject-count"></dd>
            </div>
          </dl>
          <div id="print-periods"></div>
          <footer id="print-footer" class="print-footer"></footer>
        </section>
      </main>
    </div>

    <dialog id="subject-dialog">
      <form id="subject-form" class="dialog-card">
        <div class="dialog-heading">
          <h2 data-i18n="add-subject"></h2>
          <button class="close-button" type="button" data-close-dialog aria-label="Fermer">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <label>
          <span data-i18n="subject-name"></span>
          <input id="subject-name" maxlength="80" required>
        </label>
        <div class="dialog-actions">
          <button class="secondary-button" type="button" data-close-dialog data-i18n="cancel"></button>
          <button class="primary-button" type="submit" data-i18n="add"></button>
        </div>
      </form>
    </dialog>

    <dialog id="period-dialog">
      <form id="period-form" class="dialog-card">
        <div class="dialog-heading">
          <h2 data-i18n="manage-periods"></h2>
          <button class="close-button" type="button" data-close-dialog aria-label="Fermer">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <label>
          <span data-i18n="period"></span>
          <select id="period-manage-select"></select>
        </label>
        <label>
          <span data-i18n="period-name"></span>
          <input id="period-name" maxlength="60">
        </label>
        <div class="dialog-actions dialog-actions-wrap">
          <button id="create-period" class="secondary-button" type="button" data-i18n="create-period"></button>
          <button id="rename-period" class="secondary-button" type="button" data-i18n="rename-period"></button>
          <button id="delete-period" class="danger-button" type="button" data-i18n="delete-period"></button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog">
      <form id="settings-form" class="dialog-card">
        <div class="dialog-heading">
          <h2 data-i18n="settings"></h2>
          <button class="close-button" type="button" data-close-dialog aria-label="Fermer">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <label>
          <span data-i18n="language"></span>
          <select id="language-select">
            <option value="fr">Français</option>
            <option value="en">English</option>
          </select>
        </label>
        <label>
          <span data-i18n="theme"></span>
          <select id="theme-select">
            <option value="light" data-i18n="light"></option>
            <option value="dark" data-i18n="dark"></option>
          </select>
        </label>
        <label>
          <span data-i18n="text-size"></span>
          <select id="text-size-select">
            <option value="normal" data-i18n="normal"></option>
            <option value="large" data-i18n="large"></option>
          </select>
        </label>
        <div class="dialog-divider"></div>
        <button id="export-backup" class="secondary-button full-width" type="button" data-i18n="export-backup"></button>
        <label class="secondary-button file-button full-width">
          <span data-i18n="import-backup"></span>
          <input id="backup-input" type="file" accept="application/json,.json">
        </label>
        <button id="clear-data" class="danger-button full-width" type="button" data-i18n="clear-data"></button>
        <p class="privacy-note" data-i18n="backup-note"></p>
      </form>
    </dialog>

    <dialog id="profile-dialog">
      <form id="profile-form" class="dialog-card">
        <div class="dialog-heading">
          <h2 data-i18n="edit-profile"></h2>
          <button class="close-button" type="button" data-close-dialog aria-label="Fermer">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <label>
          <span data-i18n="your-name"></span>
          <input id="edit-profile-name" maxlength="60" required>
        </label>
        <label>
          <span data-i18n="your-level"></span>
          <select id="edit-profile-level">
            <option value="L1">L1 · 70</option>
            <option value="L2">L2 · 70</option>
            <option value="L3">L3 · 75</option>
            <option value="L4">L4 · 80</option>
          </select>
        </label>
        <div class="dialog-actions">
          <button class="secondary-button" type="button" data-close-dialog data-i18n="cancel"></button>
          <button class="primary-button" type="submit" data-i18n="save"></button>
        </div>
      </form>
    </dialog>

    <dialog id="install-dialog">
      <div class="dialog-card">
        <div class="dialog-heading">
          <h2 data-i18n="install"></h2>
          <button class="close-button" type="button" data-close-dialog aria-label="Fermer">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <p id="install-instructions"></p>
        <div class="dialog-actions">
          <button class="primary-button" type="button" data-close-dialog data-i18n="close"></button>
        </div>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
